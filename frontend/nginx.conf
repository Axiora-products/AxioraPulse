# Detect social-media / search-engine crawlers so we can serve OG-tag HTML
map $http_user_agent $is_social_bot {
    default                                                          0;
    "~*whatsapp"                                                     1;
    "~*telegram"                                                     1;
    "~*facebookexternalhit"                                          1;
    "~*facebookcatalog"                                              1;
    "~*twitterbot"                                                   1;
    "~*twittercard"                                                  1;
    "~*linkedinbot"                                                  1;
    "~*slackbot"                                                     1;
    "~*discordbot"                                                   1;
    "~*googlebot"                                                    1;
    "~*bingbot"                                                      1;
    "~*(bot|spider|crawler|scraper|preview|curl|wget|python-requests|axios|java/)" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend — strips /api prefix before forwarding
    location /api/ {
        proxy_pass http://axiora-pulse-backend-alb-879506233.ap-south-1.elb.amazonaws.com/;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # React SPA — route all paths to index.html
    # EXCEPTION: /s/:slug — serve OG-tag HTML to social-media bots so
    # WhatsApp/Telegram/LinkedIn etc. generate rich link previews.
    location ~* ^/s/([^/]+)$ {
        if ($is_social_bot) {
            proxy_pass http://axiora-pulse-backend-alb-879506233.ap-south-1.elb.amazonaws.com/surveys/og/$1;
        }
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (Vite hashes filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Never cache index.html so deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
